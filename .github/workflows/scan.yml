name: Arb scan

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write              # to commit the regenerated page back to the repo

concurrency:
  group: arb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scanner
        id: scan
        run: python3 scan.py

      - name: Commit updated page
        run: |
          git config user.name  "arb-bot"
          git config user.email "arb-bot@users.noreply.github.com"
          git add docs/index.html docs/data.json docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "scan: ${{ steps.scan.outputs.summary }}"
            git push
          fi

      - name: Email on executable arb
        if: steps.scan.outputs.has_arb == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Arb Bot <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "🟢 Executable arb found — ${{ steps.scan.outputs.summary }}"
          body: file://alert.txt
